[project]
name = "finevision"
version = "0.1.0"
description = "FineVision workbench and ML/data toolkit"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "boto3>=1.40",
  "grpcio>=1.75",
  "numpy>=2.0",
  "opentelemetry-api>=1.38",
  "opentelemetry-exporter-otlp-proto-grpc>=1.38",
  "opentelemetry-instrumentation-grpc>=0.59b0",
  "opentelemetry-sdk>=1.38",
  "pika>=1.3",
  "pillow>=10.0",
  "prometheus-client>=0.22",
  "protobuf>=6.33",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dinov3 = [
  "onnx==1.17.0",
  "onnxruntime==1.20.1",
  "timm>=1.0.19",
  "torch>=2.7",
  "torchvision>=0.22",
]

[dependency-groups]
dev = [
  "grpcio-tools>=1.75",
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
