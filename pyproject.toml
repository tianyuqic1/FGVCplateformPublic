[project]
name = "finevision"
version = "0.1.0"
description = "FineVision workbench and ML/data toolkit"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "numpy>=2.0",
  "pillow>=10.0",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dinov3 = [
  "timm>=1.0.19",
  "torch>=2.7",
  "torchvision>=0.22",
]
vlm = [
  "accelerate>=1.0",
  "qwen-vl-utils>=0.0.14",
  "torch>=2.7",
  "transformers>=4.51,<5",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
