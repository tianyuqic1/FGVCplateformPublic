name: finevision

x-control-plane-environment: &control-plane-environment
  FINEVISION_HARDWARE_TOKEN: ${FINEVISION_HARDWARE_TOKEN:-finevision-dev-hardware-only}
  FINEVISION_DATABASE_URL: postgres://finevision:finevision@postgres:5432/finevision
  FINEVISION_LLM_GATEWAY_URL: http://go-llm-gateway:8080
  FINEVISION_LLM_INTERNAL_TOKEN: ${FINEVISION_LLM_INTERNAL_TOKEN:-finevision-dev-internal-only}

x-object-store-environment: &object-store-environment
  FINEVISION_S3_ENDPOINT: http://object-store:9000
  FINEVISION_S3_REGION: us-east-1
  FINEVISION_S3_ACCESS_KEY: ${FINEVISION_S3_ACCESS_KEY:-finevision}
  FINEVISION_S3_SECRET_KEY: ${FINEVISION_S3_SECRET_KEY:-finevision-dev-object-secret}
  FINEVISION_ARTIFACT_BUCKET: finevision-artifacts

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://go-control-plane:8000
    ports:
      - "5173:5173"
    depends_on:
      go-control-plane:
        condition: service_started
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/scripts:/app/scripts:ro
      - ./frontend/index.html:/app/index.html:ro

  go-control-plane:
    image: finevision-go:phase1
    volumes:
      - finevision-uploads:/data/uploads:ro
    build:
      context: .
      dockerfile: Dockerfile.go
    environment:
      <<: *control-plane-environment
      FINEVISION_S3_ENDPOINT: http://object-store:9000
      FINEVISION_S3_REGION: us-east-1
      FINEVISION_S3_ACCESS_KEY: ${FINEVISION_S3_ACCESS_KEY:-finevision}
      FINEVISION_S3_SECRET_KEY: ${FINEVISION_S3_SECRET_KEY:-finevision-dev-object-secret}
      FINEVISION_ARTIFACT_BUCKET: finevision-artifacts
      FINEVISION_HTTP_ADDRESS: :8000
      FINEVISION_UPLOAD_DIR: /data/uploads
      FINEVISION_GRPC_ADDRESS: :9000
      FINEVISION_LEASE_TTL: 150s
      FINEVISION_DEPLOYMENT_TOKEN: ${FINEVISION_DEPLOYMENT_TOKEN:-}
      FINEVISION_TENSORRT_GRPC: ${FINEVISION_TENSORRT_GRPC:-}
      FINEVISION_TENSORRT_TARGET: ${FINEVISION_TENSORRT_TARGET:-}
      FINEVISION_ASCEND_GRPC: ${FINEVISION_ASCEND_GRPC:-}
      FINEVISION_ASCEND_TARGET: ${FINEVISION_ASCEND_TARGET:-}
    ports:
      - "8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      go-llm-gateway:
        condition: service_started
      object-store-init:
        condition: service_completed_successfully

      python-artifact-runtime:
        condition: service_healthy

  outbox-relay:
    image: finevision-go:phase1
    entrypoint: ["/usr/local/bin/outbox-relay"]
    environment:
      FINEVISION_DATABASE_URL: postgres://finevision:finevision@postgres:5432/finevision
      FINEVISION_RABBITMQ_URL: amqp://finevision:finevision@rabbitmq:5672/
      FINEVISION_TRAINING_EXCHANGE: finevision.training.v1
      FINEVISION_TRAINING_QUEUE: finevision.training.v1
      FINEVISION_TRAINING_ROUTING_KEY: training.ready
      FINEVISION_TRAINING_DLX: finevision.training.dlx.v1
      FINEVISION_TRAINING_DLQ: finevision.training.dlq.v1
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  deployment-relay:
    image: finevision-go:phase1
    entrypoint: ["/usr/local/bin/deployment-relay"]
    restart: unless-stopped
    environment:
      FINEVISION_DATABASE_URL: postgres://finevision:finevision@postgres:5432/finevision
      FINEVISION_RABBITMQ_URL: amqp://finevision:finevision@rabbitmq:5672/
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  go-llm-gateway:
    image: finevision-go:phase1
    entrypoint: ["/usr/local/bin/llm-gateway"]
    environment:
      FINEVISION_LLM_GATEWAY_ADDRESS: :8080
      FINEVISION_LLM_INTERNAL_TOKEN: ${FINEVISION_LLM_INTERNAL_TOKEN:-finevision-dev-internal-only}
      FINEVISION_LLM_PROVIDER: ${FINEVISION_LLM_PROVIDER:-OpenAI-compatible}
      FINEVISION_LLM_BASE_URL: ${FINEVISION_LLM_BASE_URL:-https://api.openai.com/v1}
      FINEVISION_LLM_MODEL: ${FINEVISION_LLM_MODEL:-gpt-5.5}
      FINEVISION_LLM_API_KEY: ${FINEVISION_LLM_API_KEY:-}

  hardware-collector:
    build:
      context: .
      dockerfile: Dockerfile.hardware
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      FINEVISION_HARDWARE_ENDPOINT: http://go-control-plane:8000/api/internal/hardware/samples
      FINEVISION_HARDWARE_TOKEN: ${FINEVISION_HARDWARE_TOKEN:-finevision-dev-hardware-only}
      FINEVISION_NODE_ID: ${FINEVISION_NODE_ID:-local-compute}
      FINEVISION_NODE_NAME: ${FINEVISION_NODE_NAME:-本地计算节点}
      FINEVISION_HOST_PROC: /host/proc
      FINEVISION_HARDWARE_DISKS: '{"数据与元数据":"/data/metadata","训练工作区":"/data/work","模型缓存":"/data/cache","对象存储":"/data/objects"}'
    depends_on:
      go-control-plane:
        condition: service_started
    volumes:
      - /proc:/host/proc:ro
      - finevision-metadata:/data/metadata:ro
      - finevision-compute-work:/data/work:ro
      - finevision-artifact-cache:/data/cache:ro
      - finevision-object-store:/data/objects:ro

  python-training-worker:
    image: finevision-python-compute:phase1
    build:
      context: .
      dockerfile: Dockerfile.compute
    command: ["python", "-m", "finevision.compute.queue_worker"]
    environment:
      <<: *object-store-environment
      FINEVISION_RABBITMQ_URL: amqp://finevision:finevision@rabbitmq:5672/
      FINEVISION_TRAINING_QUEUE: finevision.training.v1
      FINEVISION_NODE_ID: ${FINEVISION_NODE_ID:-local-compute}
      FINEVISION_CONTROL_PLANE_GRPC: go-control-plane:9000
      FINEVISION_METADATA_DIR: /data/metadata
      FINEVISION_ARTIFACT_DIR: /data/work
      FINEVISION_COMPUTE_DEVICE: ${FINEVISION_TRAINING_DEVICE:-${FINEVISION_COMPUTE_DEVICE:-cpu}}
      FINEVISION_FEATURE_BATCH_SIZE: ${FINEVISION_FEATURE_BATCH_SIZE:-8}
      FINEVISION_LINEAR_HEAD_DEVICE: ${FINEVISION_LINEAR_HEAD_DEVICE:-cpu}
    depends_on:
      go-control-plane:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
      pretrained-weight-init:
        condition: service_completed_successfully
    volumes:
      - finevision-metadata:/data/metadata:ro
      - finevision-compute-work:/data/work
      - finevision-artifact-cache:/data/cache
      - ${HOME}/.cache/huggingface:/home/finevision/.cache/huggingface
      - ${HOME}/.cache/torch:/home/finevision/.cache/torch

  python-inference-runtime:
    image: fgvc-python-inference:multi-runtime
    build:
      context: .
      dockerfile: Dockerfile.inference
    command: ["python", "-m", "finevision.compute.inference_runtime"]
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; from finevision.compute.v1 import inference_runtime_pb2 as p, inference_runtime_pb2_grpc as g; g.InferenceRuntimeStub(grpc.insecure_channel('localhost:9100')).Health(p.HealthRequest(), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    environment:
      <<: *object-store-environment
      FINEVISION_INFERENCE_GRPC_ADDRESS: "[::]:9100"
      FINEVISION_ARTIFACT_CACHE_DIR: /data/cache
      FINEVISION_COMPUTE_DEVICE: ${FINEVISION_INFERENCE_DEVICE:-${FINEVISION_COMPUTE_DEVICE:-cpu}}
      FINEVISION_FEATURE_BATCH_SIZE: ${FINEVISION_FEATURE_BATCH_SIZE:-8}
    depends_on:
      pretrained-weight-init:
        condition: service_completed_successfully
    volumes:
      - finevision-artifact-cache:/data/cache
      - ${HOME}/.cache/huggingface:/home/finevision/.cache/huggingface
      - ${HOME}/.cache/torch:/home/finevision/.cache/torch

  python-artifact-runtime:
    image: finevision-python-compute:phase1
    command: ["python", "-m", "finevision.compute.artifact_runtime"]
    environment:
      <<: *object-store-environment
      FINEVISION_ARTIFACT_GRPC_ADDRESS: "[::]:9200"
      FINEVISION_ARTIFACT_CACHE_DIR: /data/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:9200')).result(timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      object-store-init:
        condition: service_completed_successfully
    volumes:
      - finevision-export-cache:/data/cache

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql+psycopg://finevision:finevision@postgres:5432/finevision
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: finevision
      POSTGRES_USER: finevision
      POSTGRES_PASSWORD: finevision
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finevision -d finevision"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - finevision-postgres:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: finevision
      RABBITMQ_DEFAULT_PASS: finevision
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - finevision-rabbitmq:/var/lib/rabbitmq

  object-store:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${FINEVISION_S3_ACCESS_KEY:-finevision}
      MINIO_ROOT_PASSWORD: ${FINEVISION_S3_SECRET_KEY:-finevision-dev-object-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - finevision-object-store:/data

  object-store-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set finevision http://object-store:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        for bucket in finevision-datasets finevision-artifacts finevision-uploads; do
          mc mb --ignore-existing "finevision/$${bucket}"
          mc version enable "finevision/$${bucket}"
          mc anonymous set none "finevision/$${bucket}"
        done
    environment:
      MINIO_ROOT_USER: ${FINEVISION_S3_ACCESS_KEY:-finevision}
      MINIO_ROOT_PASSWORD: ${FINEVISION_S3_SECRET_KEY:-finevision-dev-object-secret}

  pretrained-weight-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      object-store-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set finevision http://object-store:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        promote() {
          source="$${1}"
          object="$${2}"
          expected="$${3}"
          expected_size="$${4}"
          actual="$$(sha256sum "$${source}")"
          test "$${actual%% *}" = "$${expected}"
          test "$$(wc -c < "$${source}" | tr -d ' ')" = "$${expected_size}"
          mc cp --attr "sha256=$${expected}" "$${source}" "finevision/finevision-artifacts/$${object}"
          actual="$$(mc cat "finevision/finevision-artifacts/$${object}" | sha256sum)"
          test "$${actual%% *}" = "$${expected}"
        }
        promote /weights/pretrained/dinov3/vit_small_patch16_dinov3.lvd1689m.safetensors pretrained/dinov3/2a/2a1ec16ae28ffa07bc0ead0241ee7df9fc26451fe6f9f839b7b3afa0a906b040 2a1ec16ae28ffa07bc0ead0241ee7df9fc26451fe6f9f839b7b3afa0a906b040 86362376
        promote /weights/pretrained/imagenet/vit_small_patch16_224.augreg_in21k_ft_in1k.safetensors pretrained/imagenet/vit-small/79/79c03c635cdfd798a364a9d8c4e5c0b7255b975ea2c9616046d4f77ab01435aa 79c03c635cdfd798a364a9d8c4e5c0b7255b975ea2c9616046d4f77ab01435aa 88216496
        promote /weights/pretrained/imagenet/resnet50.a1_in1k.safetensors pretrained/imagenet/resnet-50/77/773525d5821de224f8f30c33377b7a795d7863e08522698200d3217d3f2a41bb 773525d5821de224f8f30c33377b7a795d7863e08522698200d3217d3f2a41bb 102469840
    environment:
      MINIO_ROOT_USER: ${FINEVISION_S3_ACCESS_KEY:-finevision}
      MINIO_ROOT_PASSWORD: ${FINEVISION_S3_SECRET_KEY:-finevision-dev-object-secret}
    volumes:
      - ./weights:/weights:ro

  adminer:
    image: adminer:4.8.1
    profiles: ["debug"]
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  finevision-uploads:
  finevision-export-cache:
  finevision-postgres:
  finevision-rabbitmq:
  finevision-object-store:
  finevision-metadata:
  finevision-compute-work:
  finevision-artifact-cache:
