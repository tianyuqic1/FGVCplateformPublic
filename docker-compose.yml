name: finevision

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8001
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/scripts:/app/scripts:ro
      - ./frontend/index.html:/app/index.html:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://finevision:finevision@postgres:5432/finevision
      FINEVISION_METADATA_DIR: /data/metadata
      FINEVISION_ARTIFACT_DIR: /data/artifacts
      FINEVISION_UPLOAD_DIR: /data/uploads
      FINEVISION_IMPORTED_DATASET_DIR: /data/imported-datasets
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - finevision-metadata:/data/metadata
      - finevision-artifacts:/data/artifacts
      - finevision-uploads:/data/uploads
      - finevision-imported-datasets:/data/imported-datasets
      - ./backend/src:/app/backend/src:ro
      - ./data:/app/data:ro
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/torch:/root/.cache/torch

  ml-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg://finevision:finevision@postgres:5432/finevision
      FINEVISION_METADATA_DIR: /data/metadata
      FINEVISION_ARTIFACT_DIR: /data/artifacts
      FINEVISION_IMPORTED_DATASET_DIR: /data/imported-datasets
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - finevision-metadata:/data/metadata
      - finevision-artifacts:/data/artifacts
      - finevision-imported-datasets:/data/imported-datasets
      - ./backend/src:/app/backend/src:ro
      - ./data:/app/data:ro
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/torch:/root/.cache/torch

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finevision
      POSTGRES_USER: finevision
      POSTGRES_PASSWORD: finevision
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finevision -d finevision"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - finevision-postgres:/var/lib/postgresql/data

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  finevision-metadata:
  finevision-artifacts:
  finevision-uploads:
  finevision-imported-datasets:
  finevision-postgres:
