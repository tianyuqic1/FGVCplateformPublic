global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: finevision-go-control-plane
    metrics_path: /metrics
    static_configs:
      - targets: [go-control-plane:8000]
  - job_name: finevision-go-llm-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [go-llm-gateway:8080]
  - job_name: finevision-observability-console
    metrics_path: /metrics
    static_configs:
      - targets: [observability-console:9400]
  - job_name: finevision-relays
    static_configs:
      - targets: [outbox-relay:8089, deployment-relay:8090]
  - job_name: finevision-python-runtimes
    static_configs:
      - targets:
          - python-training-worker:9301
          - python-inference-runtime:9302
          - python-artifact-runtime:9303
          - hardware-collector:9304
          - host.docker.internal:9306
  - job_name: finevision-optional-accelerators
    static_configs:
      - targets:
          - tensorrt-inference:9302
          - ascend-inference:9302
          - tensorrt-builder:9305
          - ascend-builder:9305
        labels:
          required: "false"
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [object-store:9000]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
