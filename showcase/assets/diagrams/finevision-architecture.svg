<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">FineVision 系统架构总览</title>
  <desc id="desc">React 前端访问 Go 控制面；控制面协调 PostgreSQL、RabbitMQ、MinIO、LLM Gateway 和 Python 计算服务。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#65717b"/>
    </marker>
    <style>
      .box{fill:#edf2f4;stroke:#87949e;stroke-width:1.4;rx:2}
      .line{fill:none;stroke:#65717b;stroke-width:2;marker-end:url(#arrow)}
      .dash{stroke-dasharray:7 5}
      .label{fill:#142b3d;font:20px system-ui,-apple-system,"Microsoft YaHei",sans-serif;text-anchor:middle}
      .sub{fill:#526777;font:15px system-ui,-apple-system,"Microsoft YaHei",sans-serif;text-anchor:middle}
    </style>
  </defs>

  <path class="line" d="M550 82 V145"/>
  <path class="line" d="M135 230 V355"/>
  <path class="line" d="M550 230 C550 275 170 280 170 355"/>
  <path class="line dash" d="M550 230 V285 H390 V355"/>
  <path class="line" d="M550 230 C550 285 620 285 620 355"/>
  <path class="line" d="M665 187 H760"/>
  <path class="line" d="M665 165 C790 105 1000 110 1080 145"/>
  <path class="line" d="M875 230 V355"/>
  <path class="line dash" d="M1145 230 C1145 290 390 280 390 355"/>
  <path class="line" d="M1145 230 C1145 285 620 285 620 355"/>
  <path class="line" d="M1145 230 V295 H1080 V355"/>
  <path class="line" d="M1145 230 C1145 285 1300 285 1300 355"/>

  <rect class="box" x="430" y="20" width="240" height="62"/>
  <text class="label" x="550" y="48">浏览器 / React 前端</text>
  <text class="sub" x="550" y="70">Vite · React Router</text>

  <rect class="box" x="45" y="145" width="180" height="85"/>
  <text class="label" x="135" y="180">DB Migrate</text>
  <text class="sub" x="135" y="205">SQL migrations</text>

  <rect class="box" x="435" y="145" width="230" height="85"/>
  <text class="label" x="550" y="180">Go Control Plane</text>
  <text class="sub" x="550" y="205">Chi · pgx · 状态机</text>

  <rect class="box" x="760" y="145" width="230" height="85"/>
  <text class="label" x="875" y="180">Go LLM Gateway</text>
  <text class="sub" x="875" y="205">Eino · 结构化输出</text>

  <rect class="box" x="1010" y="145" width="270" height="85"/>
  <text class="label" x="1145" y="180">Python Compute Services</text>
  <text class="sub" x="1145" y="205">训练 · 构建 · 推理 · 标注</text>

  <rect class="box" x="55" y="355" width="230" height="90"/>
  <text class="label" x="170" y="393">PostgreSQL</text>
  <text class="sub" x="170" y="420">状态 · 血缘 · 事件 · 策略</text>

  <rect class="box" x="305" y="355" width="170" height="90"/>
  <text class="label" x="390" y="393">RabbitMQ</text>
  <text class="sub" x="390" y="420">异步任务队列</text>

  <rect class="box" x="495" y="355" width="250" height="90"/>
  <text class="label" x="620" y="393">MinIO</text>
  <text class="sub" x="620" y="420">数据集 · 权重 · 模型 · 报告</text>

  <rect class="box" x="765" y="355" width="220" height="90"/>
  <text class="label" x="875" y="393">Multimodal Provider</text>
  <text class="sub" x="875" y="420">OpenAI-compatible API</text>

  <rect class="box" x="1005" y="355" width="150" height="90"/>
  <text class="label" x="1080" y="393">Model Runtime</text>
  <text class="sub" x="1080" y="420">ORT · TRT · Ascend</text>

  <rect class="box" x="1175" y="355" width="250" height="90"/>
  <text class="label" x="1300" y="393">Annotation Toolchain</text>
  <text class="sub" x="1300" y="420">VLM · SAM2 · CLIP · Qdrant</text>
</svg>
