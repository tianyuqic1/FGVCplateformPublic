<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FineVision Workbench</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.setTimeout(() => {
        const root = document.getElementById("root");
        if (root && root.childElementCount === 0) {
          const notice = document.createElement("div");
          notice.setAttribute("role", "alert");
          notice.style.cssText = "max-width:560px;margin:10vh auto;padding:24px;border:1px solid #d5dfe4;border-radius:12px;background:#fff;color:#243847;font:16px/1.7 system-ui,sans-serif";
          notice.textContent = "前端未能完成加载。请检查浏览器控制台与 frontend 容器健康状态；本地开发可运行 docker compose up -d --build frontend 后刷新。";
          root.append(notice);
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
