<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FineVision Workbench Prototype</title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --ink: #111827;
        --ink-2: #263244;
        --muted: #667085;
        --line: #dbe3ed;
        --line-2: #e8eef5;
        --teal: #0f766e;
        --cyan: #0891b2;
        --blue: #315fbd;
        --green: #26804f;
        --amber: #a15c07;
        --rose: #b4233c;
        --violet: #6750a4;
        --shadow: 0 18px 48px rgba(17, 24, 39, 0.1);
        --soft-shadow: 0 8px 28px rgba(17, 24, 39, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--bg);
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 0%, rgba(8, 145, 178, 0.14), transparent 28%),
          radial-gradient(circle at 88% 16%, rgba(103, 80, 164, 0.12), transparent 28%),
          linear-gradient(180deg, #fbfdff 0%, var(--bg) 380px);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 264px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
        height: 100vh;
        padding: 18px;
        border-right: 1px solid rgba(219, 227, 237, 0.82);
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(22px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 48px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        border-radius: 8px;
        color: #ffffff;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent),
          linear-gradient(135deg, var(--teal), var(--blue));
        box-shadow: 0 12px 30px rgba(49, 95, 189, 0.24);
      }

      .brand strong,
      .brand span {
        display: block;
      }

      .brand span,
      .muted,
      .small,
      .metric span,
      .panel-title span,
      .row-meta,
      .crumb,
      .empty,
      .field label {
        color: var(--muted);
      }

      .nav-section {
        display: grid;
        gap: 6px;
      }

      .nav-caption {
        margin: 10px 8px 4px;
        color: #8a96a8;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .nav-button,
      .primary-button,
      .secondary-button,
      .ghost-button,
      .icon-button,
      .tab-button,
      .seg-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 38px;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 0 12px;
        font-weight: 800;
        color: var(--ink-2);
        background: transparent;
      }

      .nav-button {
        justify-content: flex-start;
        width: 100%;
      }

      .nav-button:hover,
      .ghost-button:hover,
      .secondary-button:hover,
      .icon-button:hover,
      .tab-button:hover,
      .seg-button:hover {
        transform: translateY(-1px);
        border-color: #c9d5e2;
        background: #ffffff;
        box-shadow: var(--soft-shadow);
      }

      .nav-button.active {
        color: #ffffff;
        background: linear-gradient(135deg, #102033, #0f766e);
        box-shadow: 0 14px 34px rgba(15, 118, 110, 0.22);
      }

      .primary-button {
        color: #ffffff;
        background: linear-gradient(135deg, var(--teal), var(--blue));
        box-shadow: 0 14px 34px rgba(49, 95, 189, 0.2);
      }

      .secondary-button,
      .ghost-button,
      .icon-button,
      .tab-button,
      .seg-button {
        border-color: var(--line);
        background: #ffffff;
      }

      .ghost-button {
        color: #41516a;
        background: rgba(255, 255, 255, 0.72);
      }

      .icon-button {
        width: 38px;
        padding: 0;
      }

      .tab-button.active,
      .seg-button.active {
        color: var(--teal);
        border-color: rgba(15, 118, 110, 0.28);
        background: #ddf5f1;
      }

      .sidebar-card {
        margin-top: auto;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: var(--soft-shadow);
      }

      .main {
        min-width: 0;
        padding: 18px clamp(16px, 2.4vw, 32px) 34px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 68px;
        margin: -18px calc(clamp(16px, 2.4vw, 32px) * -1) 18px;
        padding: 12px clamp(16px, 2.4vw, 32px);
        border-bottom: 1px solid rgba(219, 227, 237, 0.72);
        background: rgba(245, 247, 251, 0.82);
        backdrop-filter: blur(22px);
      }

      .topbar-left {
        min-width: 0;
      }

      .crumb {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 3px;
        font-size: 12px;
        font-weight: 800;
      }

      .topbar h1,
      .panel-title h2,
      .page-hero h2,
      h3,
      p {
        margin-top: 0;
      }

      .topbar h1 {
        margin: 0;
        overflow-wrap: anywhere;
        font-size: 24px;
        line-height: 1.18;
        letter-spacing: 0;
      }

      .topbar-actions,
      .toolbar,
      .tabs,
      .chips,
      .row-actions,
      .review-actions,
      .segmented {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: min(360px, 34vw);
        min-height: 38px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        background: #ffffff;
      }

      .search-box input {
        width: 100%;
        border: 0;
        outline: 0;
        color: var(--ink);
        background: transparent;
      }

      .page {
        animation: pageIn 360ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      @keyframes pageIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .page-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: end;
        margin-bottom: 16px;
        padding: 20px;
        border: 1px solid rgba(219, 227, 237, 0.82);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.72)),
          radial-gradient(circle at 78% 10%, rgba(8, 145, 178, 0.12), transparent 28%);
        box-shadow: var(--soft-shadow);
      }

      .page-hero h2 {
        margin-bottom: 7px;
        font-size: clamp(26px, 3.4vw, 42px);
        line-height: 1.06;
        letter-spacing: 0;
      }

      .page-hero p {
        max-width: 820px;
        margin-bottom: 0;
        color: var(--muted);
        line-height: 1.62;
      }

      .grid {
        display: grid;
        gap: 14px;
      }

      .grid.metrics {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .grid.two {
        grid-template-columns: minmax(0, 1.18fr) minmax(340px, 0.82fr);
      }

      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .grid.four {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .grid.review {
        grid-template-columns: minmax(320px, 0.58fr) minmax(0, 1.42fr);
      }

      .grid.detail {
        grid-template-columns: minmax(0, 0.9fr) minmax(360px, 1.1fr);
      }

      .panel,
      .metric,
      .card,
      .sample-card,
      .image-card,
      .timeline-item,
      .pipeline-node,
      .drawer-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--soft-shadow);
      }

      .panel {
        padding: 16px;
      }

      .panel-title {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .panel-title h2 {
        margin-bottom: 4px;
        font-size: 18px;
        line-height: 1.25;
      }

      .panel-title span,
      .small {
        font-size: 13px;
        line-height: 1.45;
      }

      .metric {
        position: relative;
        overflow: hidden;
        min-height: 124px;
        padding: 15px;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          border-color 180ms ease;
      }

      .metric:hover,
      .card:hover,
      .sample-card:hover,
      .pipeline-node:hover,
      .image-card:hover {
        transform: translateY(-2px);
        border-color: #c6d4e2;
        box-shadow: var(--shadow);
      }

      .metric::after {
        content: "";
        position: absolute;
        top: -32px;
        right: -30px;
        width: 96px;
        height: 96px;
        border-radius: 999px;
        background: var(--glow, rgba(8, 145, 178, 0.12));
      }

      .metric strong {
        display: block;
        margin: 12px 0 8px;
        font-size: 28px;
        line-height: 1;
      }

      .metric span {
        display: block;
        min-height: 34px;
        font-size: 13px;
        line-height: 1.36;
      }

      .bar,
      .meter,
      .candidate-track,
      .sparkline {
        overflow: hidden;
        height: 8px;
        border-radius: 999px;
        background: #e8eef5;
      }

      .bar i,
      .meter i,
      .candidate-track i,
      .sparkline i {
        position: relative;
        display: block;
        width: var(--value, 50%);
        height: 100%;
        border-radius: inherit;
        background: var(--fill, var(--teal));
      }

      .bar.shimmer i::after,
      .pipeline-node.running .bar i::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.48), transparent);
        animation: shimmer 1.5s infinite;
      }

      @keyframes shimmer {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(100%);
        }
      }

      .status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
        min-height: 26px;
        padding: 0 9px;
        border-radius: 999px;
        color: var(--status-ink, var(--teal));
        background: var(--status-bg, #ddf5f1);
        font-size: 12px;
        font-weight: 900;
        white-space: nowrap;
      }

      .status.info {
        --status-ink: var(--blue);
        --status-bg: #e3ebff;
      }

      .status.warn {
        --status-ink: var(--amber);
        --status-bg: #fff0d4;
      }

      .status.risk {
        --status-ink: var(--rose);
        --status-bg: #ffe2e8;
      }

      .status.neutral {
        --status-ink: #536170;
        --status-bg: #edf2f7;
      }

      .data-table {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
      }

      .data-row {
        display: grid;
        grid-template-columns: 1.22fr 0.72fr 0.72fr 0.84fr 0.82fr auto;
        align-items: center;
        gap: 12px;
        min-height: 58px;
        padding: 0 13px;
        border-top: 1px solid var(--line-2);
        transition:
          background 160ms ease,
          transform 160ms ease;
      }

      .data-row:first-child {
        border-top: 0;
      }

      .data-row:not(.head):hover {
        background: #f8fbfd;
      }

      .data-row.clickable {
        cursor: pointer;
      }

      .clickable {
        cursor: pointer;
      }

      .data-row.head {
        min-height: 42px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0;
        text-transform: uppercase;
        background: var(--panel-soft);
      }

      .card {
        padding: 14px;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          border-color 180ms ease;
      }

      .card h3 {
        margin-bottom: 7px;
        font-size: 16px;
      }

      .card p {
        margin-bottom: 12px;
        color: var(--muted);
        line-height: 1.45;
      }

      .visual {
        position: relative;
        overflow: hidden;
        min-height: 128px;
        border-radius: 8px;
        background:
          linear-gradient(135deg, var(--a), var(--b)),
          repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.16) 0 8px, transparent 8px 16px);
      }

      .visual::before {
        content: "";
        position: absolute;
        inset: 20% 23%;
        border-radius: 42% 58% 48% 52%;
        background: rgba(255, 255, 255, 0.56);
        box-shadow:
          20px 14px 0 rgba(255, 255, 255, 0.22),
          -14px 20px 0 rgba(0, 0, 0, 0.13);
      }

      .visual::after {
        content: attr(data-label);
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 9px;
        overflow: hidden;
        color: #ffffff;
        font-size: 12px;
        font-weight: 900;
        text-overflow: ellipsis;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.46);
        white-space: nowrap;
      }

      .bird {
        --a: #447b70;
        --b: #d7b66f;
      }

      .leaf {
        --a: #26724d;
        --b: #d4df86;
      }

      .part {
        --a: #687586;
        --b: #a8c2d1;
      }

      .defect {
        --a: #556070;
        --b: #c6655a;
      }

      .ood {
        --a: #76578b;
        --b: #e18d63;
      }

      .low {
        filter: saturate(0.54) contrast(0.88);
      }

      .image-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }

      .image-card {
        overflow: hidden;
        background: #ffffff;
      }

      .image-card .caption {
        padding: 10px;
      }

      .candidate {
        display: grid;
        grid-template-columns: 132px minmax(0, 1fr) 48px;
        align-items: center;
        gap: 10px;
        min-height: 36px;
      }

      .timeline {
        position: relative;
        display: grid;
        gap: 10px;
      }

      .timeline-item {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr) auto;
        align-items: center;
        gap: 11px;
        min-height: 62px;
        padding: 10px;
      }

      .timeline-icon {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 8px;
        color: var(--teal);
        background: #ddf5f1;
      }

      .pipeline {
        display: grid;
        grid-template-columns: repeat(6, minmax(170px, 1fr));
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 6px;
      }

      .pipeline-node {
        position: relative;
        min-height: 190px;
        padding: 14px;
      }

      .pipeline-node::before {
        content: "";
        position: absolute;
        top: 16px;
        right: 16px;
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--teal);
        box-shadow: 0 0 0 7px rgba(15, 118, 110, 0.12);
      }

      .pipeline-node.running::before {
        background: var(--amber);
        box-shadow: 0 0 0 7px rgba(161, 92, 7, 0.12);
        animation: pulse 1.6s infinite;
      }

      @keyframes pulse {
        50% {
          transform: scale(1.35);
          opacity: 0.72;
        }
      }

      .pipeline-node h3 {
        margin: 12px 0 8px;
        font-size: 16px;
      }

      .sample-card {
        display: grid;
        grid-template-columns: 126px minmax(0, 1fr);
        gap: 13px;
        padding: 12px;
      }

      .sample-card .visual {
        min-height: 126px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        font-size: 12px;
        font-weight: 900;
      }

      .input,
      .field select,
      .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 11px;
        color: var(--ink);
        background: #ffffff;
      }

      .field textarea {
        min-height: 94px;
        resize: vertical;
      }

      .code-panel {
        overflow-x: auto;
        border-radius: 8px;
        padding: 14px;
        color: #d7e7ff;
        background: #0f1b2d;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        line-height: 1.55;
      }

      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 50;
        display: none;
        align-items: center;
        gap: 9px;
        max-width: min(420px, calc(100vw - 44px));
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid rgba(15, 118, 110, 0.2);
        border-radius: 8px;
        color: #064e47;
        background: rgba(237, 252, 249, 0.94);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        animation: toastIn 240ms ease;
      }

      .toast.visible {
        display: flex;
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 1180px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .sidebar-card,
        .nav-caption {
          display: none;
        }

        .nav-section {
          grid-template-columns: repeat(4, minmax(120px, 1fr));
        }

        .grid.metrics,
        .grid.four {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .grid.two,
        .grid.review,
        .grid.detail {
          grid-template-columns: 1fr;
        }

        .image-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 760px) {
        .main {
          padding-left: 12px;
          padding-right: 12px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .topbar-actions,
        .search-box {
          width: 100%;
        }

        .page-hero,
        .grid.metrics,
        .grid.three,
        .grid.four,
        .image-grid,
        .field-grid {
          grid-template-columns: 1fr;
        }

        .nav-section {
          grid-template-columns: 1fr 1fr;
        }

        .data-row,
        .data-row.head,
        .timeline-item,
        .sample-card {
          grid-template-columns: 1fr;
          align-items: start;
          padding: 12px;
        }

        .candidate {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast"></div>
    <script>
      const navItems = [
        { id: "dashboard", label: "工作台", icon: "layout-dashboard" },
        { id: "datasets", label: "数据集", icon: "database" },
        { id: "training", label: "训练", icon: "flask-conical" },
        { id: "inference", label: "推理实验室", icon: "image-up" },
        { id: "review", label: "人工复核", icon: "user-check" },
        { id: "models", label: "模型版本", icon: "boxes" },
        { id: "pipelines", label: "流水线", icon: "route" },
      ];

      const datasets = [
        {
          id: "bird",
          name: "鸟类细粒度分类",
          classes: 200,
          images: 12480,
          version: "dataset@014",
          model: "bird-cls-v4",
          status: "production",
          quality: 92,
          coverage: 82,
          ood: 96.3,
          description: "面向鸟类物种识别，核心难点是易混类别、姿态变化、背景干扰和长尾类样本不足。",
        },
        {
          id: "defect",
          name: "工业零件缺陷",
          classes: 18,
          images: 4260,
          version: "dataset@006",
          model: "part-defect-v2",
          status: "calibrating",
          quality: 86,
          coverage: 74,
          ood: 91.8,
          description: "面向表面缺陷、边缘破损、孔洞和划痕识别，需要较强的坏图和 OOD 拦截能力。",
        },
        {
          id: "leaf",
          name: "叶片病害识别",
          classes: 34,
          images: 8910,
          version: "dataset@003",
          model: "未发布",
          status: "training",
          quality: 79,
          coverage: 0,
          ood: 0,

            <div class="grid two">
              <div class="panel"><div class="panel-title"><div><h2>训练队列</h2><span>点击进入运行详情。</span></div></div><div class="timeline">${trainingRuns.map(runRow).join("")}</div></div>
              <div class="panel"><div class="panel-title"><div><h2>训练配置模板</h2><span>MVP 先支持 frozen backbone + 分类头。</span></div></div><div class="code-panel">backbone: dinov3_vitl<br />feature_cache: true<br />head: linear<br />calibration: temperature_scaling<br />abstention: top1_margin + embedding_distance<br />report: accuracy, macro_f1, coverage_risk</div></div>
            </div>
          `,
        );
      }

      function runRow(run) {
        const kind = run.status === "done" ? "" : "warn";
        return `
          <div class="timeline-item clickable" data-page="training-detail" data-id="${run.id}">
            <div class="timeline-icon">${icon(run.status === "done" ? "check" : "loader-circle", 18)}</div>
            <div><strong>${run.name}</strong><div class="row-meta">${run.dataset} · ${run.metric}</div><div class="bar ${run.status !== "done" ? "shimmer" : ""}" style="margin-top:8px;--value:${run.progress}%;--fill:${run.status === "done" ? "#0f766e" : "#a15c07"}"><i></i></div></div>
            ${status(run.status === "done" ? "完成" : "运行中", kind)}
          </div>
        `;
      }

      function trainingDetailPage() {
        const run = trainingRuns.find((item) => item.id === state.id) || trainingRuns[0];
        return shell(
          run.name,
          `${icon("flask-conical", 14)} 训练 ${icon("chevron-right", 13)} ${run.id}`,
          `
            <div class="page-hero"><div><h2>${run.name}</h2><p>${run.dataset} · 训练分类头、生成校准报告、准备候选模型版本。</p></div><div class="toolbar"><button class="ghost-button" data-page="training">${icon("arrow-left", 16)}返回</button><button class="primary-button" data-toast="已打开 TensorBoard 日志">${icon("external-link", 16)}日志</button></div></div>
            <div class="grid metrics">
              ${metric("进度", `${run.progress}%`, "epoch 13 / 18", "#a15c07", run.progress, "loader-circle")}
              ${metric("Val Acc", "91.9%", "比 v4 +0.3%", "#0f766e", 91, "target")}
              ${metric("Macro F1", "88.4%", "长尾类仍偏低", "#315fbd", 88, "bar-chart-3")}
              ${metric("复核压力", "+4%", "覆盖率提高带来的成本", "#b4233c", 44, "user-check")}
            </div>
            <div class="grid two" style="margin-top:14px">
              <div class="panel"><div class="panel-title"><div><h2>运行步骤</h2><span>每一步都应有产物和失败恢复点。</span></div></div><div class="timeline">${gate("数据快照", "dataset@014 locked", "pass")}${gate("特征缓存", "embedding@014 loaded", "pass")}${gate("分类头训练", "epoch 13 / 18 running", "pending")}${gate("阈值扫描", "等待训练完成", "pending")}</div></div>
              <div class="panel"><div class="panel-title"><div><h2>候选发布判断</h2><span>不要只看 accuracy。</span></div></div>${curveRow("accuracy", "91.9%", 91, "#0f766e")}${curveRow("coverage", "86%", 86, "#315fbd")}${curveRow("review cost", "预计 +¥32/day", 54, "#a15c07")}</div>
            </div>
          `,
        );
      }

      function inferencePage() {
        return shell(
          "推理实验室",
          `${icon("image-up", 14)} 推理`,
          `
            <div class="grid detail">
              <div class="panel">
                <div class="panel-title"><div><h2>输入样本</h2><span>支持单图、批量和 API 回放。</span></div><button class="ghost-button" data-toast="已模拟上传样本">${icon("upload", 16)}上传</button></div>
                ${visual("bird", "query image", true)}
                <div class="field-grid" style="margin-top:12px">
                  <div class="field"><label>数据集</label><select><option>鸟类细粒度分类</option><option>工业零件缺陷</option></select></div>
                  <div class="field"><label>模型版本</label><select><option>bird-cls-v4 production</option><option>bird-cls-v5 staging</option></select></div>
                </div>
                <div class="toolbar" style="margin-top:12px"><button class="primary-button" data-toast="推理完成，结果进入右侧面板">${icon("play", 16)}运行推理</button><button class="ghost-button">${icon("scissors-line-dashed", 16)}启用 SAM3</button></div>
              </div>
              <div class="panel">
                <div class="panel-title"><div><h2>推理结果</h2><span>模型结果、弃权判断、近邻解释。</span></div>${status("进入复核", "warn")}</div>
                <div class="grid two">
                  <div>
                    ${candidate("黑喉石鵖", 0.52, "#0891b2")}
                    ${candidate("普通石鵖", 0.49, "#a15c07")}
                    ${candidate("赭红尾鸲", 0.21, "#315fbd")}
                    <div class="chips" style="margin-top:12px">${status("margin 0.03", "warn")}${status("同域", "info")}${status("不直出", "risk")}</div>
                  </div>
                  <div class="code-panel">decision: abstain<br />reason: top1_top2_margin_below_threshold<br />next: create_review_item<br />llm_budget: low<br />sam3: optional</div>
                </div>
                <div class="panel-title" style="margin-top:16px"><div><h2>近邻样本</h2><span>辅助解释，不作为真值。</span></div></div>
                <div class="image-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${visualCard("bird", "nn-1")}${visualCard("bird", "nn-2")}${visualCard("ood", "hard negative")}</div>
              </div>
            </div>
          `,
        );
      }

      function candidate(label, score, fill) {
        return `<div class="candidate"><strong>${label}</strong><div class="candidate-track" style="--value:${Math.round(score * 100)}%;--fill:${fill}"><i></i></div><span>${score.toFixed(2)}</span></div>`;
      }

      function reviewPage() {
        return shell(
          "人工复核",
          `${icon("user-check", 14)} 复核队列`,
          `
            <div class="page-hero"><div><h2>让人工只处理模型真正不确定的样本。</h2><p>复核页是这个系统的产品核心：模型弃权、LLM 预读、人工确认、标签回流都发生在这里。</p></div><div class="segmented"><button class="seg-button active">高风险</button><button class="seg-button">OOD</button><button class="seg-button">坏图</button><button class="seg-button">争议</button></div></div>
            <div class="grid review">
              <div class="panel"><div class="panel-title"><div><h2>队列</h2><span>点击样本进入复核详情。</span></div></div><div class="grid">${reviewItems.map(reviewCard).join("")}</div></div>
              <div class="panel"><div class="panel-title"><div><h2>批量处理建议</h2><span>适合审核主管查看。</span></div></div><div class="timeline">${taskItem("ban", "5 条疑似 OOD", "建议统一标记后进入压力集。", "查看", "review-detail", "risk", "sample-0820")}${taskItem("image-off", "12 条坏图", "遮挡、低光照、主体不完整。", "查看", "review-detail", "warn", "sample-0831")}${taskItem("tags", "8 条类别争议", "需要更新类别定义和 LLM 提示。", "查看", "dataset-detail", "info", "bird")}</div></div>
            </div>
          `,
        );
      }

      function reviewDetailPage() {
        const item = reviewItems.find((row) => row.id === state.id) || reviewItems[0];
        return shell(
          item.id,
          `${icon("user-check", 14)} 复核 ${icon("chevron-right", 13)} ${item.dataset}`,
          `
            <div class="page-hero"><div><h2>${item.title}</h2><p>${item.llm}</p></div><div class="toolbar"><button class="ghost-button" data-page="review">${icon("arrow-left", 16)}返回队列</button><button class="primary-button" data-toast="复核结果已提交并进入回流池">${icon("check", 16)}提交复核</button></div></div>
            <div class="grid detail">
              <div class="panel">
                <div class="panel-title"><div><h2>图像对比</h2><span>原图、主体裁剪、SAM3 mask 和近邻。</span></div></div>
                ${visual(item.type, "原图", item.route !== "ood")}
                <div class="image-grid" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px">${visualCard(item.type, "SAM3 mask")}${visualCard("bird", "近邻正例")}${visualCard("ood", "hard negative")}</div>
              </div>
              <div class="panel">
                <div class="panel-title"><div><h2>审核表单</h2><span>人工标签是唯一可回流真值。</span></div>${status(item.risk, item.route === "ood" ? "risk" : "warn")}</div>
                <div class="grid">
                  <div class="card"><h3>模型候选</h3>${candidate(item.model.split(" ")[0], Number(item.model.split(" ")[1]) || 0.52, "#0891b2")}${candidate(item.second.split(" ")[0], Number(item.second.split(" ")[1]) || 0.49, "#a15c07")}</div>
                  <div class="card"><h3>LLM 建议</h3><p>${item.llm}</p>${status("辅助判断，不写入真值", "info")}</div>
                  <div class="field-grid">
                    <div class="field"><label>最终标签</label><select><option>普通石鵖</option><option>黑喉石鵖</option><option>OOD</option><option>坏图</option></select></div>
                    <div class="field"><label>回流目标</label><select><option>训练候选池</option><option>压力集</option><option>坏图池</option><option>争议池</option></select></div>
                  </div>
                  <div class="field"><label>审核备注</label><textarea>喉部色块不明显，建议保留到争议池二审。</textarea></div>
                </div>
              </div>
            </div>
          `,
        );
      }

      function modelsPage() {
        return shell(
          "模型版本",
          `${icon("boxes", 14)} 模型注册表`,
          `
            <div class="grid metrics">
              ${metric("线上版本", "v4", "bird-cls-v4", "#0f766e", 88, "rocket", "model-detail")}
              ${metric("候选版本", "v5", "等待人工抽检", "#315fbd", 64, "git-compare", "model-detail")}
              ${metric("校准误差", "2.8%", "ECE after scaling", "#26804f", 72, "thermometer", "model-detail")}
              ${metric("LLM 成本", "¥126", "今日复核辅助", "#a15c07", 44, "wallet-cards", "model-detail")}
            </div>
            <div class="grid two" style="margin-top:14px">
              <div class="panel"><div class="panel-title"><div><h2>版本注册表</h2><span>点击版本查看发布门禁。</span></div></div><div class="grid three">${modelCard("bird-cls-v4", "production", "DINOv3-L + Linear Head · dataset@014", "")}${modelCard("bird-cls-v5", "staging", "新增 1,420 条复核样本 · 待抽检", "info")}${modelCard("sam3-exp", "experiment", "主体裁剪三路实验 · 不可发布", "warn")}</div></div>
              <div class="panel"><div class="panel-title"><div><h2>发布门禁</h2><span>生产系统不允许只凭 accuracy 上线。</span></div></div><div class="timeline">${gate("离线评估", "top-1、macro F1、混淆矩阵", "pass")}${gate("OOD 压力集", "拦截率和误拒率", "pass")}${gate("人工抽检", "长尾、易混、低置信", "pending")}${gate("回滚策略", "保留上一生产模型", "pass")}</div></div>
            </div>
          `,
        );
      }

      function modelCard(name, label, desc, kind) {
        return `<div class="card clickable" data-page="model-detail" data-id="${name}">${status(label, kind)}<h3 style="margin-top:10px">${name}</h3><p>${desc}</p><div class="bar" style="--value:${label === "production" ? 91 : label === "staging" ? 86 : 48}%;--fill:${label === "experiment" ? "#a15c07" : "#0f766e"}"><i></i></div></div>`;
      }

      function modelDetailPage() {
        return shell(
          state.id || "bird-cls-v4",
          `${icon("boxes", 14)} 模型 ${icon("chevron-right", 13)} 版本详情`,
          `
            <div class="page-hero"><div><h2>${state.id || "bird-cls-v4"}</h2><p>模型详情页把权重、数据版本、阈值策略、评估报告、发布门禁和回滚配置放在一起。</p></div><div class="toolbar"><button class="ghost-button" data-page="models">${icon("arrow-left", 16)}返回</button><button class="primary-button" data-toast="已提交灰度发布申请">${icon("rocket", 16)}灰度发布</button></div></div>
            <div class="grid two">
              <div class="panel"><div class="panel-title"><div><h2>版本元数据</h2><span>可追溯是算法平台的底线。</span></div></div><div class="code-panel">model: ${state.id || "bird-cls-v4"}<br />dataset: bird/dataset@014<br />features: embedding@014<br />backbone: dinov3_vitl<br />head: linear<br />threshold: selective-v4<br />artifact: weights/bird-cls-v4.safetensors</div></div>
              <div class="panel"><div class="panel-title"><div><h2>评估指标</h2><span>包含自动覆盖和弃权后的准确率。</span></div></div>${curveRow("top-1 accuracy", "91.6%", 91, "#0f766e")}${curveRow("coverage", "82%", 82, "#315fbd")}${curveRow("selective risk", "4.1%", 41, "#a15c07")}</div>
            </div>
          `,
        );
      }

      function pipelinesPage() {
        return shell(
          "流水线",
          `${icon("route", 14)} 编排`,
          `
            <div class="page-hero"><div><h2>把数据、训练、弃权和发布串成可重跑流程。</h2><p>流水线视图面向工程实现：每个节点都有输入产物、输出产物、日志和失败恢复点。</p></div><button class="primary-button" data-page="pipeline-run" data-id="pipe-014">${icon("play", 16)}运行流水线</button></div>
            <div class="panel">
              <div class="panel-title"><div><h2>模板：DINOv3 分类头训练</h2><span>点击节点查看运行样式。</span></div></div>
              <div class="pipeline">
                ${pipelineNode("数据导入", "生成 dataset version", "folder-input", "", 100)}
                ${pipelineNode("数据审计", "坏图、错标、长尾", "badge-check", "", 100)}
                ${pipelineNode("特征提取", "DINOv3 embedding", "cpu", "", 100)}
                ${pipelineNode("分类头训练", "Linear / MLP", "flask-conical", "running", 72)}
                ${pipelineNode("校准弃权", "coverage-risk", "circle-gauge", "running", 38)}
                ${pipelineNode("发布回流", "灰度、监控、回流", "rocket", "", 0)}
              </div>
            </div>
          `,
        );
      }

      function pipelineNode(title, desc, ic, running, pct) {
        return `<div class="pipeline-node ${running}" data-page="pipeline-run" data-id="pipe-014">${icon(ic, 20)}<h3>${title}</h3><p class="small">${desc}</p><div class="bar" style="margin-top:16px;--value:${pct}%;--fill:${running ? "#a15c07" : "#0f766e"}"><i></i></div><div class="row-meta" style="margin-top:8px">${pct}%</div></div>`;
      }

      function pipelineRunPage() {
        return shell(
          "pipe-014",
          `${icon("route", 14)} 流水线 ${icon("chevron-right", 13)} 运行详情`,
          `
            <div class="page-hero"><div><h2>DINOv3 分类头训练运行中</h2><p>当前卡在分类头训练和阈值扫描。正式实现里这里会显示日志、产物链接和失败重试。</p></div><div class="toolbar"><button class="ghost-button" data-page="pipelines">${icon("arrow-left", 16)}返回</button><button class="primary-button" data-toast="已暂停流水线">${icon("pause", 16)}暂停</button></div></div>
            <div class="grid two">
              <div class="panel"><div class="panel-title"><div><h2>运行节点</h2><span>正在持续更新。</span></div></div><div class="timeline">${gate("数据导入", "dataset@014", "pass")}${gate("特征提取", "embedding@014", "pass")}${gate("分类头训练", "epoch 13 / 18", "pending")}${gate("阈值扫描", "等待模型权重", "pending")}</div></div>
              <div class="panel"><div class="panel-title"><div><h2>日志预览</h2><span>保留给后端任务系统。</span></div></div><div class="code-panel">[12:41:03] load feature cache embedding@014<br />[12:41:18] start linear head training<br />[12:46:55] epoch 13 val_acc=0.919 macro_f1=0.884<br />[12:47:02] waiting for calibration sweep...</div></div>
            </div>
          `,
        );
      }

      function render() {
        const pages = {
          dashboard: dashboardPage,
          datasets: datasetsPage,
          "dataset-detail": datasetDetailPage,
          training: trainingPage,
          "training-detail": trainingDetailPage,
          inference: inferencePage,
          review: reviewPage,
          "review-detail": reviewDetailPage,
          models: modelsPage,
          "model-detail": modelDetailPage,
          pipelines: pipelinesPage,
          "pipeline-run": pipelineRunPage,
        };
        document.getElementById("app").innerHTML = (pages[state.page] || dashboardPage)();
        document.querySelectorAll("[data-page]").forEach((el) => {
          el.addEventListener("click", (event) => {
            event.stopPropagation();
            setRoute(el.dataset.page, el.dataset.id || "", el.dataset.tab || "overview");
          });
        });
        document.querySelectorAll("[data-toast]").forEach((el) => {
          el.addEventListener("click", (event) => {
            event.stopPropagation();
            toast(el.dataset.toast);
          });
        });
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }

      render();
    </script>
  </body>
</html>
