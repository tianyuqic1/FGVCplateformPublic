services:
  hardware-collector:
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility

  python-training-worker:
    environment:
      FINEVISION_COMPUTE_DEVICE: cuda
      FINEVISION_LINEAR_HEAD_DEVICE: cuda
    gpus: all

  python-inference-runtime:
    environment:
      FINEVISION_COMPUTE_DEVICE: cuda
    gpus: all
