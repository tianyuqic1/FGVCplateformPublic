openapi: 3.0.3
info:
  title: FineVision Hardware Monitoring
  version: 1.0.0
  description: Companion contract to finevision.yaml. Routes are registered by internal/hardware.Handler. Reads follow the existing control-plane access boundary; only collectors can write using a separate bearer token.
tags:
  - name: 硬件监控
    description: 计算节点状态、历史指标、告警与活动训练任务。
  - name: 内部采集器
    description: 硬件采集 Agent 使用的受保护写入接口。
paths:
  /api/internal/hardware/samples:
    post:
      tags: [内部采集器]
      summary: 上报节点硬件快照
      operationId: ingestHardwareSample
      security: [{CollectorToken: []}]
      description: Report at most once per five seconds per host. Clock tolerance is 30 seconds. Server assigns received_at; samples must have a strictly newer sampled_at than the node's previous sample. Body limit 128 KiB. No samples are replayed after an outage.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Snapshot'}
      responses:
        '202':
          description: Persisted
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/hardware/nodes:
    get:
      tags: [硬件监控]
      summary: 查询计算节点列表
      operationId: listHardwareNodes
      responses:
        '200':
          description: Known nodes including offline nodes; no configured nodes returns an empty array.
          content:
            application/json:
              schema:
                type: object
                required: [nodes, server_time]
                properties:
                  server_time: {type: string, format: date-time}
                  nodes:
                    type: array
                    items:
                      type: object
                      required: [node_id, name, status, received_at]
                      properties:
                        node_id: {type: string}
                        name: {type: string}
                        received_at: {type: string, format: date-time}
                        status: {$ref: '#/components/schemas/Status'}
        '503': {$ref: '#/components/responses/Error'}
  /api/hardware/nodes/{nodeID}:
    get:
      tags: [硬件监控]
      summary: 获取节点详情与历史指标
      operationId: getHardwareNode
      parameters:
        - {in: path, name: nodeID, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$'}}
        - {in: query, name: window, schema: {type: string, enum: [15m, 1h, 24h], default: 15m}}
      responses:
        '200':
          description: Latest snapshot, history, sustained pressure alerts, and training tasks with an active unexpired attempt on this node. History keeps the last real reading in each 5/15/300-second bucket. GPU attribution to individual tasks is not inferred. The active attempt node is also exposed as nullable runtime_node_id on existing training-run reads.
          content:
            application/json:
              schema:
                type: object
                required: [snapshot, status, history, tasks, alerts, server_time, step_seconds]
                properties:
                  snapshot: {$ref: '#/components/schemas/Snapshot'}
                  status: {$ref: '#/components/schemas/Status'}
                  server_time: {type: string, format: date-time}
                  step_seconds: {type: integer, enum: [5, 15, 300]}
                  history: {type: array, items: {$ref: '#/components/schemas/Snapshot'}}
                  tasks:
                    type: array
                    items:
                      type: object
                      required: [id, name, started_at]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        started_at: {type: string, format: date-time}
                  alerts:
                    type: array
                    items:
                      type: object
                      required: [code, message]
                      properties:
                        code: {type: string}
                        message: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    CollectorToken: {type: http, scheme: bearer}
  responses:
    Error:
      description: Invalid input, unavailable data, or denied collector request.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
  schemas:
    Status:
      type: string
      enum: [online, stale, offline]
      description: Based on server receive time; stale after 15 seconds, offline after 60 seconds. Missing metrics are null, never fabricated zeroes.
    Metric: {type: number, nullable: true, minimum: 0}
    Memory:
      type: object
      required: [used_bytes, total_bytes]
      properties:
        used_bytes: {$ref: '#/components/schemas/Metric'}
        total_bytes: {$ref: '#/components/schemas/Metric'}
    Snapshot:
      type: object
      additionalProperties: false
      required: [node_id, name, scope, sampled_at, cpu, memory, gpus, gpu_status, disks, errors]
      properties:
        node_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$'}
        name: {type: string, minLength: 1, maxLength: 160}
        scope: {type: string, enum: [host]}
        sampled_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time, readOnly: true}
        cpu:
          type: object
          required: [percent, cores]
          properties:
            percent: {type: number, minimum: 0, maximum: 100, nullable: true}
            cores: {type: integer, minimum: 0, maximum: 65536}
        memory: {$ref: '#/components/schemas/Memory'}
        gpu_status: {type: string, enum: [ok, none, unavailable]}
        gpus:
          type: array
          maxItems: 64
          items:
            type: object
            required: [id, name, percent, memory, temperature_c, power_w, power_limit_w]
            properties:
              id: {type: string, description: Stable GPU UUID}
              name: {type: string}
              percent: {type: number, minimum: 0, maximum: 100, nullable: true}
              memory: {$ref: '#/components/schemas/Memory'}
              temperature_c: {$ref: '#/components/schemas/Metric'}
              power_w: {$ref: '#/components/schemas/Metric'}
              power_limit_w: {$ref: '#/components/schemas/Metric'}
        disks:
          type: array
          maxItems: 64
          items:
            type: object
            required: [id, paths, memory, available_bytes]
            properties:
              id: {type: string, description: Filesystem device identity; deduplicated within a host}
              paths: {type: array, minItems: 1, maxItems: 32, items: {type: string}}
              memory: {$ref: '#/components/schemas/Memory'}
              available_bytes: {$ref: '#/components/schemas/Metric'}
        errors: {type: array, maxItems: 32, items: {type: string, maxLength: 256}}
