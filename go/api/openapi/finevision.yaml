openapi: 3.1.0
info:
  title: FineVision Control Plane API
  version: 1.0.0
servers:
  - url: /
tags:
  - name: 系统
    description: 服务存活状态与基础诊断。
  - name: 数据集
    description: 数据集导入、版本扩展与读取。
  - name: 数据集说明
    description: 数据集说明的 AI 生成、修订与读取。
  - name: 任务
    description: 异步任务状态读取。
  - name: 预训练权重
    description: 可用于训练的预训练骨干权重目录。
  - name: 模型注册
    description: 模型版本、比较、别名和生命周期管理。
  - name: 大模型辅助
    description: 受控的大模型辅助能力。
  - name: 训练
    description: 训练任务创建、指标读取与生命周期控制。
  - name: 内部训练 Worker
    description: 训练 Worker 使用的租约、心跳和结果上报接口，不面向浏览器用户。
paths:
  /api/dataset-versions/{dataset_version_id}/card:
    parameters:
      - {name: dataset_version_id, in: path, required: true, schema: {type: string}}
    get:
      tags: [数据集说明]
      summary: 获取数据集说明
      operationId: getDatasetCard
      responses:
        "200":
          description: Approved card, immutable facts and generation history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
        default: {$ref: "#/components/responses/ErrorResponse"}
    put:
      tags: [数据集说明]
      summary: 保存数据集说明修订
      operationId: saveDatasetCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_card, expected_revision]
              properties:
                dataset_card: {$ref: "#/components/schemas/DatasetCardContent"}
                expected_revision: {type: integer, minimum: 0}
                draft_id: {type: string, format: uuid}
      responses:
        "200":
          description: Explicitly saved new revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
        default: {$ref: "#/components/responses/ErrorResponse"}
  /api/dataset-versions/{dataset_version_id}/card/generate:
    parameters:
      - {name: dataset_version_id, in: path, required: true, schema: {type: string}}
    post:
      tags: [数据集说明]
      summary: 使用 AI 生成数据集说明建议
      operationId: generateDatasetCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id: {type: string, format: uuid}
      responses:
        "200":
          description: Independent advisory draft; does not save the card
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
        default: {$ref: "#/components/responses/ErrorResponse"}
  /api/dataset-imports:
    get:
      tags: [数据集]
      summary: 查询数据集导入任务
      operationId: listDatasetImports
      responses:
        "200":
          description: Active imports and recent completed imports (up to 40)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
        "503": {$ref: "#/components/responses/ErrorResponse"}
  /api/datasets/upload-imagefolder:
    post:
      tags: [数据集]
      summary: 上传并导入 ImageFolder 数据集
      operationId: uploadImagefolder
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, request_id, files]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                request_id: {type: string, format: uuid}
                files:
                  type: array
                  items: {type: string, format: binary}
      responses:
        "202":
          description: Upload persisted and queued for background validation and registration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "429": {$ref: "#/components/responses/ErrorResponse"}
        "503": {$ref: "#/components/responses/ErrorResponse"}
  /api/datasets/{dataset_id}/training-candidates:
    parameters:
      - $ref: "#/components/parameters/DatasetID"
    get:
      tags: [数据集]
      summary: 获取可回流训练集的已审核样本
      operationId: listTrainingCandidates
      responses:
        "200":
          description: Reviewed, labelled samples not yet included in this dataset
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
        default: {$ref: "#/components/responses/ErrorResponse"}
  /api/datasets/{dataset_id}/versions:
    parameters:
      - $ref: "#/components/parameters/DatasetID"
    post:
      tags: [数据集]
      summary: 基于已有版本创建新数据集版本
      operationId: expandDataset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [base_version_id, request_id]
              properties:
                base_version_id: {type: string}
                request_id: {type: string, format: uuid}
                feedback_ids:
                  type: string
                  description: JSON array of approved feedback UUIDs from training-candidates
                files:
                  type: array
                  items: {type: string, format: binary}
      responses:
        "201":
          description: Immutable full snapshot with training additions and unchanged evaluation sets
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
        default: {$ref: "#/components/responses/ErrorResponse"}
  /api/health:
    get:
      tags: [系统]
      summary: 检查控制面存活状态
      operationId: getHealth
      responses:
        "200":
          description: Process liveness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/datasets:
    get:
      tags: [数据集]
      summary: 查询数据集列表
      operationId: listDatasets
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [all, ready, production, training]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        "200":
          description: Dataset read models
          content:
            application/json:
              schema:
                type: object
                required: [datasets]
                properties:
                  datasets:
                    type: array
                    items: {$ref: "#/components/schemas/FreeFormObject"}
                  pagination: {$ref: "#/components/schemas/FreeFormObject"}
  /api/datasets/{dataset_id}:
    parameters:
      - $ref: "#/components/parameters/DatasetID"
    get:
      tags: [数据集]
      summary: 获取数据集详情
      operationId: getDataset
      responses:
        "200": {$ref: "#/components/responses/DatasetResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/jobs:
    get:
      tags: [任务]
      summary: 查询异步任务列表
      operationId: listJobs
      responses:
        "200":
          description: Job read models
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: {$ref: "#/components/schemas/FreeFormObject"}
  /api/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [任务]
      summary: 获取异步任务详情
      operationId: getJob
      responses:
        "200": {$ref: "#/components/responses/JobResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/model-weights:
    get:
      tags: [预训练权重]
      summary: 查询预训练权重目录
      operationId: listModelWeights
      responses:
        "200":
          description: Approved pretrained weight catalog
          content:
            application/json:
              schema:
                type: object
                required: [weights]
                properties:
                  weights:
                    type: array
                    items: {$ref: "#/components/schemas/FreeFormObject"}
  /api/model-versions:
    get:
      tags: [模型注册]
      summary: 查询模型版本列表
      operationId: listModelVersions
      parameters:
        - name: dataset_id
          in: query
          schema: {type: string}
        - name: dataset_version_id
          in: query
          schema: {type: string}
        - name: architecture
          in: query
          schema: {type: string}
        - name: pretraining
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [candidate, staging, production, archived, failed]}
        - {name: q, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        "200":
          description: Governed Model Version read models
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
  /api/model-versions/{model_version_id}:
    parameters:
      - $ref: "#/components/parameters/ModelVersionID"
    get:
      tags: [模型注册]
      summary: 获取模型版本详情
      operationId: getModelVersion
      responses:
        "200":
          description: Model Version detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/model-version-comparisons:
    post:
      tags: [模型注册]
      summary: 比较同一数据集范围内的模型版本
      operationId: compareModelVersions
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModelVersionComparisonRequest"}
      responses:
        "200":
          description: Non-persistent comparison view with comparability warnings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/model-versions/{model_version_id}/promote:
    parameters:
      - $ref: "#/components/parameters/ModelVersionID"
    post:
      tags: [模型注册]
      summary: 晋升模型版本
      operationId: promoteModelVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PromoteModelVersionRequest"}
      responses:
        "200":
          description: Promoted Model Version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/model-versions/{model_version_id}/archive:
    parameters:
      - $ref: "#/components/parameters/ModelVersionID"
    post:
      tags: [模型注册]
      summary: 归档模型版本
      operationId: archiveModelVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ArchiveModelVersionRequest"}
      responses:
        "200":
          description: Archived Model Version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/model-aliases/{alias}:
    parameters:
      - name: alias
        in: path
        required: true
        schema: {type: string, enum: [champion, challenger]}
    put:
      tags: [模型注册]
      summary: 设置数据集范围内的模型别名
      operationId: setModelAlias
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetModelAliasRequest"}
      responses:
        "200":
          description: Updated Dataset-scoped Model Alias
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/llm/assist:
    post:
      tags: [大模型辅助]
      summary: 请求大模型辅助结果
      operationId: generateLLMAssistance
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LLMAssistanceRequest"}
      responses:
        "200": {$ref: "#/components/responses/LLMAssistanceResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
        "503": {$ref: "#/components/responses/ErrorResponse"}
  /api/training-runs:
    get:
      tags: [训练]
      summary: 查询训练任务列表
      operationId: listTrainingRuns
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: dataset_id, in: query, schema: {type: string}}
        - {name: backbone_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        "200":
          description: Training Run read models
          content:
            application/json:
              schema:
                type: object
                required: [training_runs]
                properties:
                  training_runs:
                    type: array
                    items: {$ref: "#/components/schemas/FreeFormObject"}
                  pagination: {$ref: "#/components/schemas/FreeFormObject"}
    post:
      tags: [训练]
      summary: 创建训练任务
      operationId: createTrainingRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateTrainingRun"}
      responses:
        "202": {$ref: "#/components/responses/TrainingRunResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/training-runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [训练]
      summary: 获取训练任务详情
      operationId: getTrainingRun
      responses:
        "200": {$ref: "#/components/responses/TrainingRunResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/training-runs/{run_id}/metrics:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - name: attempt_id
        in: query
        schema: {type: string, format: uuid}
      - name: metric_name
        in: query
        schema: {type: string}
      - name: after_id
        in: query
        schema: {type: integer, format: int64, minimum: 0, default: 0}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 5000, default: 1000}
    get:
      tags: [训练]
      summary: 获取训练指标序列
      operationId: getTrainingRunMetrics
      responses:
        "200":
          description: Cursor-based Training Metric Points
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeFormObject"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/training-runs/{run_id}/pause:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [训练]
      summary: 暂停训练任务
      operationId: pauseTrainingRun
      responses:
        "200": {$ref: "#/components/responses/TrainingRunResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/training-runs/{run_id}/resume:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [训练]
      summary: 恢复训练任务
      operationId: resumeTrainingRun
      responses:
        "200": {$ref: "#/components/responses/TrainingRunResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/training-runs/{run_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [训练]
      summary: 取消训练任务
      operationId: cancelTrainingRun
      responses:
        "200": {$ref: "#/components/responses/TrainingRunResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /internal/training-jobs/{job_id}/claim:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      tags: [内部训练 Worker]
      summary: 领取训练任务租约
      operationId: claimTrainingJob
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClaimTrainingJob"}
      responses:
        "200": {$ref: "#/components/responses/ClaimResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /internal/training-jobs/{job_id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      tags: [内部训练 Worker]
      summary: 续约训练任务租约
      operationId: heartbeatTrainingJob
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FencedCommand"}
      responses:
        "200": {$ref: "#/components/responses/HeartbeatResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /internal/training-jobs/{job_id}/progress:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      tags: [内部训练 Worker]
      summary: 上报训练进度与指标
      operationId: reportTrainingProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/FencedCommand"
                - type: object
                  required: [progress]
                  properties:
                    progress: {$ref: "#/components/schemas/FreeFormObject"}
                    metric_points:
                      type: array
                      items: {$ref: "#/components/schemas/MetricPointInput"}
      responses:
        "204": {description: Progress accepted}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /internal/training-jobs/{job_id}/complete:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      tags: [内部训练 Worker]
      summary: 完成训练任务并登记产物
      operationId: completeTrainingJob
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompleteTrainingJob"}
      responses:
        "200": {$ref: "#/components/responses/CompleteResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /internal/training-jobs/{job_id}/fail:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      tags: [内部训练 Worker]
      summary: 上报训练任务失败
      operationId: failTrainingJob
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FailTrainingJob"}
      responses:
        "204": {description: Failure accepted}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
components:
  parameters:
    DatasetID: {name: dataset_id, in: path, required: true, schema: {type: string}}
    JobID: {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    RunID: {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
    ModelVersionID: {name: model_version_id, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    DatasetCardContent:
      type: object
      additionalProperties: false
      required: [task, domain, summary, known_confusions, ood_policy, review_guidance]
      properties:
        task: {type: string, enum: [image_classification]}
        domain: {type: string, maxLength: 6000}
        summary: {type: string, maxLength: 6000}
        known_confusions: {type: array, maxItems: 30, items: {type: string, maxLength: 6000}}
        ood_policy: {type: string, maxLength: 6000}
        review_guidance: {type: string, maxLength: 6000}
    FreeFormObject:
      type: object
      additionalProperties: true
    Health:
      type: object
      required: [status, runtime]
      properties:
        status: {type: string, enum: [ok]}
        runtime: {type: string, enum: [go-control-plane]}
    Error:
      type: object
      required: [code, message, details, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        details: {$ref: "#/components/schemas/FreeFormObject"}
        request_id: {type: string}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: {$ref: "#/components/schemas/Error"}
    DatasetEnvelope:
      type: object
      required: [dataset]
      properties:
        dataset: {$ref: "#/components/schemas/FreeFormObject"}
    JobEnvelope:
      type: object
      required: [job]
      properties:
        job: {$ref: "#/components/schemas/FreeFormObject"}
    TrainingRunEnvelope:
      type: object
      required: [training_run]
      properties:
        training_run: {$ref: "#/components/schemas/FreeFormObject"}
    ClaimResult:
      type: object
      required: [disposition, job_id]
      properties:
        disposition: {type: string, enum: [claimed, obsolete, terminal]}
        job_id: {type: string, format: uuid}
        training_run_id: {type: string, format: uuid}
        attempt_id: {type: string, format: uuid}
        execution_epoch: {type: integer, format: int64}
        lease_expires_at: {type: string, format: date-time}
        payload: {$ref: "#/components/schemas/FreeFormObject"}
    HeartbeatResult:
      type: object
      required: [directive, lease_expires_at]
      properties:
        directive: {type: string, enum: [continue, pause, cancel, fenced]}
        lease_expires_at: {type: string, format: date-time}
    LLMAssistanceRequest:
      type: object
      required: [task, context]
      properties:
        task:
          type: string
          enum: [inference_explanation, review_assistance, training_diagnosis, feedback_curation]
        context: {$ref: "#/components/schemas/FreeFormObject"}
    LLMAssistanceEnvelope:
      type: object
      required: [assistance]
      properties:
        assistance: {$ref: "#/components/schemas/FreeFormObject"}
    CompleteResult:
      type: object
      required: [job_id, training_run_id, model_version_id, metrics]
      properties:
        job_id: {type: string, format: uuid}
        training_run_id: {type: string, format: uuid}
        model_version_id: {type: string, format: uuid}
        metrics: {$ref: "#/components/schemas/FreeFormObject"}
    CreateTrainingRun:
      type: object
      required: [dataset_version_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 80, description: Human-readable training task name}
        dataset_id: {type: string}
        dataset_version_id: {type: string}
        backbone_key:
          type: string
          enum: [dinov3_vits16_lvd1689m, imagenet_vits16_augreg_in21k_ft_in1k, imagenet_resnet50_a1_in1k]
          default: dinov3_vits16_lvd1689m
        backbone_id: {type: string, deprecated: true}
        max_attempts: {type: integer, minimum: 1, maximum: 10, default: 3}
        extractor:
          type: string
          enum: [color_stats, dinov3_vits, imagenet_vits, imagenet_resnet50]
          deprecated: true
        feature_batch_size: {type: integer, minimum: 1, maximum: 128, default: 8}
        image_size: {type: integer, minimum: 128, maximum: 512, description: "Managed image training supports 128–512; ViT-S requires multiples of 16. UI presets: 224, 256, 320, 384, 448, 512. Saved preprocessing is reused by publication and inference."}
        feature_pool: {type: string, enum: [cls, model], default: cls}
        target_selective_risk: {type: number, minimum: 0, maximum: 1, default: 0.01}
        review_cost_per_item: {type: number, minimum: 0, default: 1}
        extractor_config: {$ref: "#/components/schemas/FreeFormObject"}
        head_config:
          allOf: [{$ref: "#/components/schemas/FreeFormObject"}]
          description: "Managed backbones use image_classifier_v2. DINOv3 freezes original weights; lora_enabled optionally trains attention QKV A/B with lora_rank 8 or 16, alpha=2r. ImageNet updates all backbone/head parameters and rejects LoRA. epochs 1–1000, batch_size 1–128. head_learning_rate applies to all models; backbone_learning_rate only to ImageNet; lora_learning_rate only to enabled DINO LoRA. Rates must be finite numbers in (0,1]; missing group rates fall back to legacy learning_rate. augmentations is a boolean object with random_resized_crop, horizontal_flip, vertical_flip, color_jitter, random_rotation and random_erasing, all disabled by default and applied only to train samples. New image tasks do not produce offline features."
    ClaimTrainingJob:
      type: object
      required: [dispatch_generation, worker_id]
      properties:
        dispatch_generation: {type: integer, format: int64, minimum: 1}
        worker_id: {type: string, minLength: 1}
    FencedCommand:
      type: object
      required: [attempt_id, execution_epoch]
      properties:
        attempt_id: {type: string, format: uuid}
        execution_epoch: {type: integer, format: int64, minimum: 1}
    MetricPointInput:
      type: object
      required: [name, step, value]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        step: {type: integer, format: int64, minimum: 0}
        value: {type: number, format: double}
        recorded_at: {type: string, format: date-time}
        context: {$ref: "#/components/schemas/FreeFormObject"}
    ModelVersionComparisonRequest:
      type: object
      required: [model_version_ids]
      properties:
        model_version_ids:
          type: array
          minItems: 2
          maxItems: 5
          uniqueItems: true
          items: {type: string, format: uuid}
    PromoteModelVersionRequest:
      type: object
      required: [target_status, actor, reason]
      properties:
        precision: {type: string, enum: [FP32, FP16], default: FP32, description: "Deployment precision; additional precision keeps the same dataset-scoped release version"}
        target_status: {type: string, enum: [staging, production], description: "production exports a verified classification head checkpoint and ONNX to object storage before atomic publication; candidate may publish directly"}
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 1000}
    ArchiveModelVersionRequest:
      type: object
      required: [actor, reason]
      properties:
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 1000}
    SetModelAliasRequest:
      type: object
      required: [dataset_id, model_version_id, actor, reason]
      properties:
        dataset_id: {type: string, minLength: 1}
        model_version_id: {type: string, format: uuid}
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 1000}
    ArtifactDescriptor:
      type: object
      required: [artifact_id, artifact_type, uri, sha256, size_bytes, content_type, storage_version, producer, schema_version]
      properties:
        artifact_id: {type: string, format: uuid}
        artifact_type: {type: string}
        uri: {type: string}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        size_bytes: {type: integer, format: int64, minimum: 0}
        content_type: {type: string}
        storage_version: {type: string}
        producer: {type: string}
        dataset_version_id: {type: string}
        training_run_id: {type: string}
        attempt_id: {type: string}
        schema_version: {type: integer, enum: [1]}
        created_at: {type: string, format: date-time}
        verified_at: {type: string, format: date-time}
        metadata: {$ref: "#/components/schemas/FreeFormObject"}
    CompleteTrainingJob:
      allOf:
        - $ref: "#/components/schemas/FencedCommand"
        - type: object
          required: [completion_key, result_digest, artifacts]
          properties:
            completion_key: {type: string, minLength: 1}
            result_digest: {type: string, minLength: 1}
            artifacts:
              type: array
              minItems: 1
              items: {$ref: "#/components/schemas/ArtifactDescriptor"}
            metrics: {$ref: "#/components/schemas/FreeFormObject"}
    FailTrainingJob:
      allOf:
        - $ref: "#/components/schemas/FencedCommand"
        - type: object
          required: [retryable, error_code, error_message]
          properties:
            retryable: {type: boolean}
            error_code: {type: string}
            error_message: {type: string}
  responses:
    DatasetResponse:
      description: Dataset response
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DatasetEnvelope"}
    JobResponse:
      description: Job response
      content:
        application/json:
          schema: {$ref: "#/components/schemas/JobEnvelope"}
    TrainingRunResponse:
      description: Training Run response
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TrainingRunEnvelope"}
    ClaimResponse:
      description: Claim result
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ClaimResult"}
    HeartbeatResponse:
      description: Heartbeat directive
      content:
        application/json:
          schema: {$ref: "#/components/schemas/HeartbeatResult"}
    CompleteResponse:
      description: Completion result
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CompleteResult"}
    LLMAssistanceResponse:
      description: Advisory-only LLM assistance
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LLMAssistanceEnvelope"}
    ErrorResponse:
      description: Stable error envelope
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
