syntax = "proto3";
package finevision.compute.v1;
option go_package = "github.com/tianyuqic1/FGVCplateformPublic/go/api/proto/finevision/compute/v1;computev1";
import "finevision/compute/v1/artifact.proto";
import "google/protobuf/struct.proto";
service DatasetCompute {
  rpc Scan(ScanDatasetRequest) returns (google.protobuf.Struct);
}
message ScanDatasetRequest {
  ArtifactDescriptor archive = 1;
  string dataset_id = 2;
  string dataset_version_id = 3;
}
