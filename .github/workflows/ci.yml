name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go 控制面
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: 格式检查
        run: test -z "$(gofmt -l .)"
      - name: 单元测试
        run: go test ./...
      - name: 静态检查
        run: go vet ./...

  python:
    name: Python 计算面
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装锁定依赖
        run: uv sync --frozen --group dev --extra dinov3
      - name: 单元测试
        run: uv run pytest -q

  frontend:
    name: React 工作台
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm --prefix frontend ci
      - name: 依赖安全检查
        run: npm --prefix frontend audit --audit-level=high
      - name: 生产构建
        run: |
          npm --prefix frontend run build
          node --check go/internal/observabilityconsole/ui/console.js
      - name: API 客户端契约
        run: scripts/smoke-demo.sh --contracts-only

  documentation:
    name: 中文文档
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 构建并检查展示文档
        run: |
          python3 showcase/build.py
          python3 showcase/check.py
      - name: 检查 Compose 配置
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f compose.inference.yml config --quiet
          docker compose -f docker-compose.yml -f compose.observability.yml --profile observability config --quiet
          python3 -m json.tool ops/observability/grafana/dashboards/finevision-overview.json >/dev/null
          docker run --rm --entrypoint promtool \
            -v "$PWD/ops/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 check config /etc/prometheus/prometheus.yml
      - name: 检查仓库未提交密钥
        run: |
          if git grep -n -E 'sk-[A-Za-z0-9_-]{16,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'; then
            echo "检测到疑似密钥"
            exit 1
          fi
